services:
  - type: web
    name: content-writing-tool
    env: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: content-db
          property: connectionString

databases:
  - name: content-db
    databaseName: content_db
    user: content_user
    plan: free
